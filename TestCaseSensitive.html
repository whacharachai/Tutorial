    
    
    <!DOCTYPE html>
    <html>
    <head>
        <title>Case Sensitive Variables in JavaScript</title>
    </head>
    <body>
        <script>
            // JavaScript is case sensitive
            let myVariable = "Hello";
            let MyVariable = "World";

            document.write("myVariable: " + myVariable + "<br>");
            document.write("MyVariable: " + MyVariable);
        </script>
    </body>
    </html>
