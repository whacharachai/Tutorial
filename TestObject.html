<body>
   <script>
     // Create an Object
     const person = {
       firstName : "John",
       lastName : "Doe"
     };
     console.table(person);//(2) {firstName: "John", lastName: "Doe"}

     // Add Properties
     person.age = 50;
     person.eyeColor = "blue";
     console.table(person);//(4) {firstName: "John", lastName: "Doe", age: 50, eyeColor: "blue"}

     person.hi = function() { 
       return "Hello World!"; 
     };

     console.log(person.firstName);//John
     console.log(person["lastName"]);//Doe
     console.log(person.hi());//Hello World!
   </script> 
</body>
</html>
