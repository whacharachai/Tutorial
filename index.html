<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
    <!-- Use Chrome Frame in IE -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="3D Map"
    />
    <meta name="cesium-sandcastle-labels" content="Showcases, 3D Tiles" />
    <title>3D Map</title>
    <script type="text/javascript" src="./Sandcastle-header.js"></script>
    <script
      type="text/javascript"
      src="./Cesium/Build/CesiumUnminified/Cesium.js"
      nomodule
    ></script>
    <script type="module" src="./load-cesium-es6.js"></script>
  </head>
  <body class="sandcastle-loading" data-sandcastle-bucket="bucket-requirejs.html">
    <style>
      @import url(./templates/bucket.css);
    </style>
    <div id="cesiumContainer" class="fullSize"></div>
    <div id="loadingOverlay"><h1>Loading...</h1></div>
    <div id="toolbar"></div>

    <script>
      var viewer;
 
      var camData = {
        lon: 100.42529919805114,
        lat: 13.917106463573209,
        height: 47.18035966062251,
        direction: {
          x: 0.4857370203215632,
          y: -0.08211129403234468,
          z: -0.8702397844740628
        },
        up: {
          x: 0.005975644632311373,
          y: 0.9958667592008702,
          z: -0.09062940797547127
        }
      };
    
      window.startup = async function (Cesium) {
        "use strict";
        
        viewer = new Cesium.Viewer("cesiumContainer", {
          terrain: Cesium.Terrain.fromWorldTerrain(),
          timeline: false,
          animation: false  // Also disables the animation clock widget
        });

        try {
          // const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(40866);
          const tileset = await Cesium.Cesium3DTileset.fromUrl(
            "http://127.0.0.1/BBT/Apps/Sandcastle/gallery/bbt/bbt_nb/tileset.json"
            // "http://127.0.0.1/3DMap/3D_Data/tileset.json"
			      // "https://nuinhouse.com/Cesium-1.120/Apps/Sandcastle/gallery/bbt/bbt_nb/tileset.json"
          );
          viewer.scene.primitives.add(tileset);
          // viewer.zoomTo(tileset);
        } catch (error) {
          console.log(`Error loading tileset: ${error}`);
        } 

        viewer.cesiumWidget.creditContainer.style.display = 'none';
        
        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(camData.lon, camData.lat, camData.height),
          orientation: {
            direction: new Cesium.Cartesian3(camData.direction.x, camData.direction.y, camData.direction.z),
            up: new Cesium.Cartesian3(camData.up.x, camData.up.y, camData.up.z)
          }
        }); 
      };

      if (typeof Cesium !== "undefined") {
        window.startupCalled = true;
        window.startup(Cesium).catch((error) => {
          "use strict";
          console.error(error);
        });
        // Sandcastle.finishedLoading();
      }

    </script>
  </body>
</html>
